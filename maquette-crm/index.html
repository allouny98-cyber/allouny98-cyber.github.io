/* Les derniers prix de vente d'un ouvrage, lus dans les devis acceptés : ils servent de repère pour proposer un prix. */
function dernieresVentes(code, saufId) {
  if (!code) return [];
  const r = [];
  affairesListe().forEach(a => { if (a.id === saufId || !['accepte', 'chantier', 'termine'].includes(a.etape)) return; const D = a.dates || {};
    a.lignes.forEach(l => { if (l.code === code && Number(l.pu) > 0) r.push({ pu: Number(l.pu), date: D.acceptation || D.envoi || D.demande || '', numero: a.numero }); }); });
  return r.sort((x, y) => y.date.localeCompare(x.date)).slice(0, 3);
}
const venteTxt = v => `vendu ${money(Math.round(v.pu * 100))} ${v.date ? 'en ' + moisLong(v.date.slice(0, 7)) : ''} (${v.numero})`;

function carteTarifs() {

    <p class="carte-note">Pas de coefficient fixe : Jacqui règle sa marge devis par devis. La marge visée sert seulement à proposer un prix quand il n’y en a pas. Le logiciel ne change jamais un prix de vente tout seul.</p>
    <dl class="totaux suivi-dl"><div><dt>Marge visée pour proposer un prix</dt><dd>${nbDec(margeVisee())} % du prix vendu</dd></div><div><dt>Un prix d’achat est « ancien » après</dt><dd>${esc(t.ancienMois)} mois</dd></div></dl>
    ${t.confirme ? '' : '<p class="carte-note">25 % est un exemple : la marge visée est à confirmer avec Jacqui.</p>'}
    <div class="carte-boutons"><button type="button" class="btn btn-sm" data-act="tarifs-ouvrir">Modifier</button></div></section>`;
}
function ouvrirTarifs() {
  const t = tarifs();
  ouvrirFenetre('Prix de vente : marge visée', `<form class="form" data-form="tarifs">
    <p class="carte-note">Il n’y a pas de coefficient fixe. Quand un ouvrage n’a pas encore de prix, le logiciel en propose un : le dernier prix vendu s’il existe, sinon le coût interne avec la marge visée. Exemple : un coût de 75 DH avec 25 % de marge visée donne 100 DH.</p>
    <label class="champ">Marge visée (% du prix vendu)<input name="margeVisee" type="number" step="1" min="1" max="80" required value="${esc(margeVisee())}"></label>
    <label class="champ">Signaler un prix d’achat comme « ancien » après (mois)<input name="ancienMois" type="number" step="1" min="1" max="60" required value="${esc(t.ancienMois)}"></label>

}

/* --- Catalogue : le dossier tarifaire. Prix d'achat repris de Ciel au démarrage, puis mis à jour par les bons de livraison saisis par Régine. --- */
const achatTxt = x => matDe(x) > 0 ? [x.achatFo ? nomFournisseur(x.achatFo) : '', x.achatDate ? fdate(x.achatDate) : ''].filter(Boolean).join(' · ') || 'fournisseur et date à saisir' : 'main-d’œuvre ou service';
const badgesArticle = x => (prixAncien(x) ? pill('prix ancien', 'warn') : '') + (venteARevoir(x) ? pill('prix de vente à revoir', 'bad') : '');
function ligneCatalogue(x) {
  const pu = Number(x.pu) || 0, cout = Number(x.cout) || 0, mat = matDe(x), mo = moDe(x), m = margePct(pu, cout), b = badgesArticle(x);
  return `<li><button data-act="cat-edit" data-id="${esc(x.id)}"><span class="lc-code">${esc(x.code)}</span>
    <span class="lc-des">${esc(x.designation)}<small>Coût ${money(Math.round(cout * 100))}${mat > 0 && mo > 0 ? ` (matériel ${nbr(Math.round(mat * 100))} + main-d’œuvre ${nbr(Math.round(mo * 100))})` : ''} · ${esc(achatTxt(x))}</small>${b ? `<span class="lc-badges">${b}</span>` : ''}</span>
    <span class="lc-pu">${money(Math.round(pu * 100))}<small>/ ${esc(x.unite)}</small></span><span class="lc-marge ${m < margeVisee() - 5 ? 'orange' : ''}">${m} %</span></button></li>`;
}
function listeCatalogue() {
  const q = norm(UI.catQ || '').trim(), f = UI.catFiltre || 'tous';
  const xs = catalogueListe().filter(x => (f === 'anciens' ? prixAncien(x) : f === 'revoir' ? venteARevoir(x) : true) && (!q || norm(x.code + ' ' + x.designation + ' ' + x.categorie + ' ' + (x.matNom || '') + ' ' + (x.achatFo ? nomFournisseur(x.achatFo) : '')).includes(q)));
  const groupes = {}; xs.forEach(x => { (groupes[x.categorie] = groupes[x.categorie] || []).push(x); });
  return Object.keys(groupes).sort().map(g => `<section class="carte"><header class="carte-tete"><h2>${esc(g)}</h2><span class="compteur">${groupes[g].length}</span></header>
    <ul class="liste-cat">${groupes[g].sort((x, y) => x.code.localeCompare(y.code)).map(ligneCatalogue).join('')}</ul></section>`).join('') || vide(q || f !== 'tous' ? 'Aucun ouvrage ne correspond.' : 'Catalogue vide.');
}
function vueCatalogue() {
  const xs = catalogueListe();
  const chip = (v, lbl) => `<button class="chip ${(UI.catFiltre || 'tous') === v ? 'on' : ''}" data-act="cat-filtre" data-v="${v}">${lbl}</button>`;
  return `<section class="page-tete"><div><p class="surtitre">Dossier tarifaire : ouvrages « fourniture et pose », avec leur coût interne et leur dernier prix d’achat</p><h1>Catalogue</h1></div>
    <div class="tete-boutons"><button class="btn" data-act="tarifs-ouvrir">Marge visée</button><button class="btn btn-primary" data-act="cat-edit" data-id="">+ Nouvel ouvrage</button></div></section>
  <p class="carte-note note-tarifs">Chaque ouvrage a un seul prix de vente, main-d’œuvre comprise. Son coût interne (matériel au dernier prix d’achat + main-d’œuvre estimée) n’apparaît jamais sur le devis du client. Au démarrage, les prix d’achat sont repris de Ciel ; ensuite, chaque bon de livraison enregistré par Régine les met à jour. Le prix de vente ne change jamais tout seul.</p>
  <div class="barre-outils"><input type="search" id="q-cat" placeholder="Chercher un ouvrage, un code, un fournisseur…" value="${esc(UI.catQ || '')}" aria-label="Chercher dans le catalogue">
    <div class="chips">${chip('tous', `Tous (${xs.length})`)}${chip('anciens', `Prix anciens (${xs.filter(prixAncien).length})`)}${chip('revoir', `Prix de vente à revoir (${xs.filter(venteARevoir).length})`)}</div></div>
  <div id="cat-liste" class="pile">${listeCatalogue()}</div>`;
}
function ouvrirArticle(id) {

  ouvrirFenetre(x.id ? 'Modifier ' + x.code : 'Nouvel ouvrage', `<form data-form="catalogue" data-id="${esc(x.id)}" class="form">

    <label class="champ">Main-d’œuvre estimée HT<input name="mo" type="number" step="0.01" min="0" value="${esc(x.id ? moDe(x) : '')}"></label></div>
    <label class="champ">Prix de vente HT (un seul prix, main-d’œuvre comprise)<input name="pu" type="number" step="0.01" min="0" required value="${esc(x.pu)}"></label>
    <p class="carte-note" id="cat-conseil"></p>
    ${ventes.length ? `<p class="carte-note">Derniers prix vendus : ${ventes.map(v => esc(venteTxt(v))).join(' ; ')}.</p>` : ''}
    <label class="champ">Nom du matériel sur les bons du fournisseur (facultatif)<input name="matNom" value="${esc(x.matNom || '')}" placeholder="Sert à mettre le prix d’achat à jour quand Régine saisit un bon"></label>
    <div class="ligne-form"><label class="champ">Fournisseur de ce prix d’achat<select name="achatFo"><option value="">—</option>${fos.map(f => `<option value="${esc(f.id)}" ${f.id === x.achatFo ? 'selected' : ''}>${esc(f.nom)}</option>`).join('')}</select></label>
    <label class="champ">Date de ce prix<input name="achatDate" type="date" max="${TODAY}" value="${esc(x.achatDate || '')}"></label></div>
    ${x.achatRef ? `<p class="carte-note">Dernière mise à jour du prix d’achat : ${esc(x.achatRef)}.</p>` : ''}${prixAncien(x) ? `<p class="carte-note rouge">Ce prix d’achat a plus de ${esc(tarifs().ancienMois)} mois : à vérifier auprès du fournisseur avant un gros devis.</p>` : ''}
    <div class="fen-pied"><button type="button" class="btn btn-ghost" data-act="fermer">Annuler</button><button class="btn btn-primary" type="submit">Enregistrer</button></div></form>`);
  majConseilArticle();

const articleDuFormulaire = f => { const mat = Number(f.elements.mat.value) || 0, mo = Number(f.elements.mo.value) || 0; return { mat, mo, cout: Math.round((mat + mo) * 100) / 100, pu: Number(f.elements.pu.value) || 0 }; };
function majConseilArticle() {
  const f = $('form[data-form="catalogue"]'), z = $('#cat-conseil'); if (!f || !z) return;
  const x = articleDuFormulaire(f);
  z.innerHTML = x.cout ? `Coût interne : <b>${money(Math.round(x.cout * 100))}</b> (jamais sur le devis du client). Marge avec ce prix de vente : ${margePct(x.pu, x.cout)} %. Pour ${nbDec(margeVisee())} % de marge${tarifs().confirme ? '' : ' (marge visée à confirmer)'} : ${money(Math.round(prixConseille(x) * 100))}. <button type="button" class="lien" data-act="cat-conseil">Appliquer ce prix</button>` : 'Saisissez le matériel et la main-d’œuvre : le logiciel calcule le coût interne et propose un prix.';
}
/* Un bon de livraison enregistré met à jour le prix d'achat du matériel des ouvrages concernés (même nom). Le prix de vente n'est pas touché. */
function majTarifsDepuisBon(b) {
  const maj = [];
  (b.lignes || []).forEach(l => {
    const pu = Number(l.pu) || 0; if (!pu) return;
    const x = catalogueListe().find(y => matDe(y) > 0 && cleArticle(y.matNom || y.designation) === cleArticle(l.designation)); if (!x || (x.achatDate || '') > b.date) return;
    if (matDe(x) === pu && x.achatFo === b.fournisseurId && x.achatDate === b.date) return;
    const avant = matDe(x), mo = moDe(x);
    Object.assign(x, { mat: pu, mo, cout: Math.round((pu + mo) * 100) / 100, achatFo: b.fournisseurId, achatDate: b.date, achatRef: 'bon ' + (b.ref || 'sans numéro') }); persist('catalogue', x); maj.push({ x, avant });
  });
  return maj;
}

/* --- Devis : prix d'achat, prix de vente et marge par ligne --- */
function margeLigneHTML(l, i, modifiable) {
  const a = affaireCourante(), u = a && a.unites, vente = ligneHT(l), cout = Math.round((Number(l.qte) || 0) * (Number(l.cout) || 0) * 100), m = vente - cout, x = S.catalogue[l.code], b = [];
  if (l.plan) b.push(pill('estimé d’après le plan, à vérifier', 'warn') + (modifiable ? `<button type="button" class="lien" data-act="ligne-verifie" data-i="${i}">Quantité vérifiée</button>` : ''));
  if (l.hors || !l.code) b.push(Number(l.pu) > 0 ? pill('hors catalogue', 'neutral') : pill('hors catalogue, prix à saisir', 'bad'));
  if (x && prixAncien(x)) b.push(pill('prix d’achat ancien', 'warn'));
  const v = modifiable && l.code ? dernieresVentes(l.code, a && a.id)[0] : null;
  const repere = v && v.pu !== Number(l.pu) ? `<span>Dernier prix ${esc(venteTxt(v))}</span>` : '';
  const conseil = modifiable && Number(l.cout) > 0 && !Number(l.pu) ? `<span>Pour ${nbDec(margeVisee())} % de marge : ${money(Math.round(prixPourMarge(l.cout, margeVisee()) * 100))} <button type="button" class="lien" data-act="ligne-conseil" data-i="${i}">Appliquer</button></span>` : '';
  const parU = !u ? '' : l.parUnite != null ? `<span>× ${u.nb} ${esc(pluriel(u.nb, u.nom))} = <b>${nbDec(l.qte)}</b> ${esc(l.unite || '')}${modifiable ? ` <button type="button" class="lien" data-act="ligne-par-unite" data-i="${i}">compter au total</button>` : ''}</span>` : modifiable ? `<button type="button" class="lien" data-act="ligne-par-unite" data-i="${i}">compter par ${esc(u.nom)}</button>` : '';
  return `${modifiable ? '' : `<span>Coût : ${money(cout)}</span>`}<span class="${m < 0 ? 'rouge' : ''}">Marge : ${money(m)}${vente ? ' · ' + Math.round(m / vente * 100) + ' %' : ''}</span>${parU}${repere}${conseil}${b.length ? '<span class="lg-badges">' + b.join('') + '</span>' : ''}`;
}
function avantEnvoi(a) {
  if (a.etape !== 'demande' || !a.lignes.length) return '';
  const t = totaux(a.lignes, a.remise), marge = t.ht - coutTotal(a.lignes), plan = a.lignes.filter(l => l.plan).length, sansPrix = a.lignes.filter(l => !Number(l.pu)).length, sansAchat = a.lignes.filter(l => !Number(l.cout)).length;
  const al = [plan ? nb(plan, 'quantité estimée', 'quantités estimées') + ' d’après le plan à vérifier' : '', sansPrix ? nb(sansPrix, 'ligne') + ' sans prix de vente' : '', sansAchat ? nb(sansAchat, 'ligne') + ' sans coût (la marge est surestimée)' : ''].filter(Boolean);
  return `<p class="avant-envoi${marge < 0 || al.length ? ' alerte' : ''}">${ico(al.length ? 'cloche' : 'coche')}<span>Avant l’envoi : marge prévue <b>${money(marge)}</b>, soit ${t.ht ? Math.round(marge / t.ht * 100) : 0} % du prix vendu.${al.length ? ' À régler : ' + al.join(' ; ') + '.' : ''}${plan ? ' <button type="button" class="lien" data-act="lignes-verifiees">Toutes les quantités sont vérifiées</button>' : ''}</span></p>`;
}

/* --- Plan DXF : le logiciel compte lui-même les symboles (blocs) et mesure les tracés, calque par calque. L'IA ne fait qu'associer un symbole à un ouvrage. --- */
const UNITES_DXF = { 1: ['pouces', 0.0254], 2: ['pieds', 0.3048], 4: ['mm', 0.001], 5: ['cm', 0.01], 6: ['m', 1] };

  const L = String(txt).split(/\r\n|\r|\n/), P = [], blocs = {}, longs = {};

  while (k < P.length) {
    const [c, v] = P[k];
    if (c === 0 && v === 'SECTION') { section = (P[k + 1] || [])[1] || ''; k += 2; continue; }
    if (c === 0 && v === 'ENDSEC') { finPoly(); section = ''; k++; continue; }
    if (section === 'HEADER') { if (c === 9 && v === '$INSUNITS' && P[k + 1] && P[k + 1][0] === 70) unite = parseInt(P[k + 1][1], 10) || 0; k++; continue; }
    if (section !== 'ENTITIES' || c !== 0) { k++; continue; }

    while (k < P.length && P[k][0] !== 0) { e.push(P[k]); k++; }

    if (un(67) === '1') continue; /* espace papier : pas le plan */

    if (type === 'SEQEND') { finPoly(); continue; }
    finPoly(); n++;
    if (type === 'INSERT') { const nom = un(2); if (nom && nom[0] !== '*') { const b = blocs[nom] = blocs[nom] || { nom, n: 0, calques: {} }; b.n++; b.calques[calque] = 1; } }
    else if (type === 'LINE') ajoute(calque, dist([num(10), num(20)], [num(11), num(21)]));
    else if (type === 'LWPOLYLINE') { const xs = e.filter(q => q[0] === 10).map(q => parseFloat(q[1]) || 0), ys = e.filter(q => q[0] === 20).map(q => parseFloat(q[1]) || 0); poly = { calque, ferme: (parseInt(un(70), 10) || 0) & 1, pts: xs.map((x, j) => [x, ys[j] || 0]) }; finPoly(); }
    else if (type === 'POLYLINE') poly = { calque, ferme: (parseInt(un(70), 10) || 0) & 1, pts: [] };
    else if (type === 'ARC') { let d = num(51) - num(50); if (d < 0) d += 360; ajoute(calque, num(40) * d * Math.PI / 180); }
  }
  finPoly();
  return { unite, nbEntites: n, blocs: Object.values(blocs).sort((x, y) => y.n - x.n).map(b => ({ nom: b.nom, calque: Object.keys(b.calques).join(', '), n: b.n, code: '' })),

Object.assign(FORMS, {

    S.params.tarifs = { margeVisee: Math.round(n('margeVisee', 1, 80, margeVisee())), ancienMois: Math.round(n('ancienMois', 1, 60, t.ancienMois)), confirme: !!fd.get('confirme') };

/* ---------- Base partagée ---------- */
const COLLS = ['clients', 'affaires', 'factures', 'bons', 'catalogue', 'activites', 'taches', 'demandes', 'fournisseurs', 'achats', 'heures', 'employes', 'pointages', 'blf', 'documents', 'parametres'];
function demarrerBase() {
  setSync('connexion');
  const premier = {}, tampon = {}; let bascule = false;
  const minuteur = setTimeout(() => { if (!bascule) setSync('lente'); }, 10000);
  COLLS.forEach(coll => {
    db.collection(coll).onSnapshot(snap => {
      if (!bascule) {
        tampon[coll] = {}; snap.docs.forEach(d => { tampon[coll][d.id] = clone(d.data()); }); premier[coll] = true;
        if (COLLS.every(k => premier[k])) {
          bascule = true; clearTimeout(minuteur); mode = 'db';
          COLLS.filter(k => k !== 'parametres').forEach(k => { S[k] = tampon[k]; });
          S.params = { auto: fusionParam('auto', tampon.parametres.auto), societe: fusionParam('societe', tampon.parametres.societe), equipe: fusionParam('equipe', tampon.parametres.equipe), logo: fusionParam('logo', tampon.parametres.logo), acces: fusionParam('acces', tampon.parametres.acces), exemples: fusionParam('exemples', tampon.parametres.exemples), feries: fusionParam('feries', tampon.parametres.feries), banque: fusionParam('banque', tampon.parametres.banque), quinzaines: fusionParam('quinzaines', tampon.parametres.quinzaines), tarifs: fusionParam('tarifs', tampon.parametres.tarifs), reserves: fusionParam('reserves', tampon.parametres.reserves) };
          majProfil(); majMarque();
          setSync(Object.keys(S.clients).length ? 'ok' : 'vide');
          planifierRendu();
        }
        return;
      }
      let change = false;
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (coll === 'parametres') { if (ch.type !== 'removed' && DEFAUTS[id]) { const v = fusionParam(id, clone(ch.doc.data())); if (stable(S.params[id]) !== stable(v)) { S.params[id] = v; change = true; if (id === 'equipe') majProfil(); if (id === 'logo' || id === 'societe') majMarque(); } } return; }
        if (ch.type === 'removed') { if (S[coll][id]) { delete S[coll][id]; change = true; } return; }
        const v = clone(ch.doc.data());
        if (stable(S[coll][id]) !== stable(v)) { S[coll][id] = v; change = true; }
      });
      if (change && !enReset) planifierRendu();
    }, err => { if (!bascule) { clearTimeout(minuteur); bascule = true; } setSync(err && err.code === 'revoked' ? 'lecture' : 'erreur'); });
  });
}
