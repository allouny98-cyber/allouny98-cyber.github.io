[data-scheme="dark"][data-look="clair"], [data-scheme="dark"] [data-look="clair"] { --bg: #12191D; --surface: #1A2328; --surface-2: #202B31; --ink: #E4EBEE; --muted: #9DAEB6; --line: #2F3D44; --accent: #74B9CF; --accent-ink: #10191D; --accent-soft: #1F3640; --link: #8ECBDF; --hi: #74B9CF; --side-bg: #161E22; --side-ink: #E4EBEE; --side-muted: #9DAEB6; --side-line: #2F3D44; --side-hover: #202B31; --side-on-bg: #1F3640; --side-on-ink: #8ECBDF; --side-on-bar: transparent; --logo-bg: #0C1215; --logo-fg: #F4C95D; --avatar-bg: #74B9CF; --avatar-ink: #10191D; --card-line: #2F3D44; --kpi-top: #2F3D44; --shadow: none; --ok: #4CC38A; --ok-soft: #133426; --warn: #E9A54F; --warn-soft: #3A2A14; --bad: #F2796F; --bad-soft: #3D1C1A; --info: #9DB4E0; --info-soft: #1E2A44; --volt: #F2C200; color-scheme: dark; }
[data-look="atelier"] { --r: 6px; --r-btn: 6px; --r-pill: 4px; --k: 1; --h2-case: uppercase; --h2-space: 0.05em; --font-display: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif; --font-body: 'IBM Plex Sans', 'Segoe UI', Roboto, Arial, sans-serif; --bg: #F4F2EE; --surface: #FFFFFF; --surface-2: #FAF8F5; --ink: #12294D; --muted: #5C6B7A; --line: #E3DED7; --accent: #12294D; --accent-ink: #FFFFFF; --accent-soft: #E6EBF4; --link: #2E64AD; --hi: #F97316; --side-bg: #12294D; --side-ink: #EEF2F8; --side-muted: #A9B8D0; --side-line: #27406B; --side-hover: #1B3A6B; --side-on-bg: #1F4279; --side-on-ink: #FFFFFF; --side-on-bar: #F97316; --logo-bg: #F97316; --logo-fg: #12294D; --avatar-bg: #F97316; --avatar-ink: #12294D; --card-line: #E3DED7; --kpi-top: #F97316; --shadow: none; --ok: #15744A; --ok-soft: #E2F2E9; --warn: #96500A; --warn-soft: #FBEEDC; --bad: #BE3328; --bad-soft: #FBE6E3; --info: #3B5B8F; --info-soft: #E8EEF7; --volt: #F2C200; color-scheme: light; }
[data-scheme="dark"][data-look="atelier"], [data-scheme="dark"] [data-look="atelier"] { --bg: #0A1424; --surface: #101E36; --surface-2: #162844; --ink: #EEF2F8; --muted: #A9B8D0; --line: #27406B; --accent: #F97316; --accent-ink: #12294D; --accent-soft: #22314F; --link: #8FB4E0; --hi: #F97316; --side-bg: #07101E; --side-ink: #EEF2F8; --side-muted: #A9B8D0; --side-line: #1B2E50; --side-hover: #101E36; --side-on-bg: #162844; --side-on-ink: #FFFFFF; --side-on-bar: #F97316; --logo-bg: #F97316; --logo-fg: #12294D; --avatar-bg: #F97316; --avatar-ink: #12294D; --card-line: #27406B; --kpi-top: #F97316; --shadow: none; --ok: #4CC38A; --ok-soft: #133426; --warn: #E9A54F; --warn-soft: #3A2A14; --bad: #F2796F; --bad-soft: #3D1C1A; --info: #9DB4E0; --info-soft: #1E2A44; --volt: #F2C200; color-scheme: dark; }
[data-look="confort"] { --r: 16px; --r-btn: 12px; --r-pill: 999px; --k: 1.1; --h2-case: none; --h2-space: 0; --font-display: 'Atkinson Hyperlegible', Verdana, sans-serif; --font-body: 'Atkinson Hyperlegible', Verdana, sans-serif; --bg: #EFF4F1; --surface: #FFFFFF; --surface-2: #F4F8F6; --ink: #13201B; --muted: #4F5F58; --line: #D3DDD8; --accent: #0B6B58; --accent-ink: #FFFFFF; --accent-soft: #DCEFE9; --link: #0B6B58; --hi: #0B6B58; --side-bg: #FFFFFF; --side-ink: #13201B; --side-muted: #4F5F58; --side-line: #D3DDD8; --side-hover: #EFF4F1; --side-on-bg: #0B6B58; --side-on-ink: #FFFFFF; --side-on-bar: transparent; --logo-bg: #0B6B58; --logo-fg: #FFFFFF; --avatar-bg: #0B6B58; --avatar-ink: #FFFFFF; --card-line: transparent; --kpi-top: transparent; --shadow: 0 1px 2px rgba(19, 32, 27, 0.06), 0 8px 24px rgba(19, 32, 27, 0.07); --ok: #15744A; --ok-soft: #E2F2E9; --warn: #96500A; --warn-soft: #FBEEDC; --bad: #BE3328; --bad-soft: #FBE6E3; --info: #3B5B8F; --info-soft: #E8EEF7; --volt: #F2C200; color-scheme: light; }
[data-scheme="dark"][data-look="confort"], [data-scheme="dark"] [data-look="confort"] { --bg: #0C1311; --surface: #141D1A; --surface-2: #1A2521; --ink: #E6EFEB; --muted: #9DB0A9; --line: #2A3833; --accent: #4CC9A7; --accent-ink: #0C1311; --accent-soft: #16352D; --link: #6FDDBE; --hi: #4CC9A7; --side-bg: #141D1A; --side-ink: #E6EFEB; --side-muted: #9DB0A9; --side-line: #2A3833; --side-hover: #1A2521; --side-on-bg: #4CC9A7; --side-on-ink: #0C1311; --side-on-bar: transparent; --logo-bg: #4CC9A7; --logo-fg: #0C1311; --avatar-bg: #4CC9A7; --avatar-ink: #0C1311; --card-line: #2A3833; --kpi-top: #2A3833; --shadow: none; --ok: #4CC38A; --ok-soft: #133426; --warn: #E9A54F; --warn-soft: #3A2A14; --bad: #F2796F; --bad-soft: #3D1C1A; --info: #9DB4E0; --info-soft: #1E2A44; --volt: #F2C200; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: calc(15px * var(--k))/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body.fen-ouverte { overflow: hidden; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { text-transform: var(--h2-case); letter-spacing: var(--h2-space); }
h1 { font-size: calc(26px * var(--k)); font-weight: 750; line-height: 1.15; }
h2 { font-size: calc(15px * var(--k)); font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Coque */
.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
.cote { position: sticky; top: 0; height: 100vh; background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; }
.marque { display: flex; align-items: center; gap: 10px; }
.marque > div { min-width: 0; }
.marque b, .marque small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marque-logo { width: 34px; height: 34px; border-radius: 8px; background: var(--logo-bg); display: grid; place-items: center; flex: none; }
.bolt { width: 20px; height: 20px; fill: var(--logo-fg); }
.marque b { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.04em; font-size: calc(15px * var(--k)); display: block; }
.marque small { color: var(--side-muted); font-size: calc(12px * var(--k)); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; padding: calc(9px * var(--k)) 10px; border-radius: var(--r-btn); color: var(--side-ink); font-weight: 500; }
.nav a:hover { background: var(--side-hover); text-decoration: none; }
.nav a.on { background: var(--side-on-bg); color: var(--side-on-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--side-on-bar); }
.badge { background: var(--bad); color: #fff; font-size: calc(11px * var(--k)); font-weight: 700; border-radius: 999px; min-width: 20px; padding: 1px 6px; text-align: center; }
.cote-pied { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: calc(12px * var(--k)); color: var(--side-muted); }
.test-pill { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 8px; font-weight: 600; }
.sync { font-size: calc(12px * var(--k)); font-weight: 600; }
.sync::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: currentColor; vertical-align: 1px; }
.sync { color: var(--side-muted); } .sync::before { background: #9AA3B5; }
.sync-ok::before { background: #2FB37A; } .sync-info::before { background: #5B8DEF; } .sync-warn::before { background: #E0902B; } .sync-bad::before { background: #E0564B; }
main { padding: 26px clamp(16px, 3vw, 36px) 60px; max-width: 1240px; width: 100%; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* En-têtes de page */
.page-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.surtitre { color: var(--muted); font-size: calc(13px * var(--k)); margin-bottom: 4px; }
.sous { color: var(--muted); margin-top: 4px; }
.actions-tete, .actions-etape, .tete-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.retour { font-size: calc(14px * var(--k)); font-weight: 500; align-self: flex-start; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: calc(9px * var(--k)) calc(14px * var(--k)); border-radius: var(--r-btn); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: calc(14px * var(--k)); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-sm { padding: calc(6px * var(--k)) calc(10px * var(--k)); font-size: calc(13px * var(--k)); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-x { border: 0; background: transparent; font-size: calc(22px * var(--k)); line-height: 1; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; color: var(--muted); flex: none; }
.btn-x:hover { background: var(--surface-2); color: var(--bad); }
.lien { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-size: inherit; }
.lien-sm { font-size: calc(13px * var(--k)); font-weight: 500; }

/* Cartes */
.carte { background: var(--surface); border: 1px solid var(--card-line); box-shadow: var(--shadow); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.carte-tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.carte-note { color: var(--muted); font-size: calc(13px * var(--k)); }
.compteur { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; font-size: calc(12px * var(--k)); font-weight: 700; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.deux-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.deux-col.larges { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.pile { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.vide { color: var(--muted); font-size: calc(14px * var(--k)); padding: 6px 0; }
.rouge { color: var(--bad); font-weight: 600; }
.orange { color: var(--warn); }
.ok-txt { color: var(--ok); font-weight: 600; }
.erreur { color: var(--bad); font-weight: 600; }

/* Indicateurs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.kpi { background: var(--surface); border: 1px solid var(--card-line); box-shadow: var(--shadow); border-radius: var(--r); padding: 14px 16px; border-top: 3px solid var(--kpi-top); }
.kpi-alerte { border-top-color: var(--bad); }
.kpi-lbl { font-size: calc(13px * var(--k)); color: var(--muted); }
.kpi-val { font-family: var(--font-display); font-weight: 750; font-size: calc(24px * var(--k)); font-variant-numeric: tabular-nums; margin: 2px 0; white-space: nowrap; }
.kpi-sub { font-size: calc(12.5px * var(--k)); color: var(--muted); }
.kpi-alerte .kpi-sub { color: var(--bad); font-weight: 600; }

/* Pastilles */
.pill { display: inline-block; border-radius: var(--r-pill); padding: 2px 9px; font-size: calc(12px * var(--k)); font-weight: 600; white-space: nowrap; }
.pill-neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-muted { background: transparent; color: var(--muted); border: 1px dashed var(--line); }

/* Tâches */
.taches { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tache { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-btn); padding: 10px 12px; background: var(--surface); }
/* Urgence : une pastille de couleur devant le titre (rouge, orange, bleu, gris) */
.tache-ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--niv, var(--muted)); background: color-mix(in srgb, var(--niv, var(--muted)) 13%, var(--surface)); }
.tache-ico .ico { width: 18px; height: 18px; }
.tache.niv-4 { --niv: var(--bad); }
.tache.niv-3 { --niv: var(--warn); }
.tache.niv-2 { --niv: var(--link); }
.tache.niv-1 { --niv: var(--muted); }
.tache-corps { min-width: 0; flex: 1 1 200px; }
.tache-titre { font-weight: 650; }
.tache-detail { color: var(--muted); font-size: calc(13px * var(--k)); }
.tache-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Graphique */
.graph { width: 100%; height: auto; display: block; }
.graph .bar { fill: var(--line); }
.graph .bar-cur { fill: var(--hi); }
.graph .bar-val { font: 600 11px var(--font-body); fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
.graph .bar-mois { font: 11px var(--font-body); fill: var(--muted); text-anchor: middle; }
.graph .axe { stroke: var(--muted); stroke-width: 1; }
.mini-pipe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mini-pipe { gap: 2px; }
.mp-btn { width: 100%; display: grid; grid-template-columns: 1fr 34px 110px 16px; align-items: center; gap: 8px; padding: 5px 8px; margin: 0 -8px; width: calc(100% + 16px); background: none; border: 0; border-radius: 8px; text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; }
.mp-btn:hover { background: var(--surface-2); }
.mp-btn > .ico { width: 16px; height: 16px; color: var(--muted); }
.mp-btn:hover > .ico { color: var(--link); }
.mp-n { font-weight: 700; text-align: right; }
.mp-m { text-align: right; color: var(--muted); font-size: calc(13px * var(--k)); }

/* Activités */
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.act { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.act:first-child { border-top: 0; }
.act-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-top: 7px; flex: none; }
.act .act-dot.avec-ico { width: 28px; height: 28px; margin-top: 1px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); box-shadow: none; }
.act-dot.avec-ico .ico { width: 15px; height: 15px; }
.act-appel .act-dot.avec-ico { background: var(--info-soft); color: var(--info); } .act-visite .act-dot.avec-ico { background: var(--warn-soft); color: var(--warn); } .act-whatsapp .act-dot.avec-ico { background: var(--ok-soft); color: var(--ok); }
.act-email .act-dot.avec-ico, .act-auto .act-dot.avec-ico { background: var(--accent-soft); color: var(--link); }
.act-appel .act-dot { background: var(--info); } .act-visite .act-dot { background: var(--warn); } .act-whatsapp .act-dot { background: var(--ok); }
.act-email .act-dot { background: var(--accent); } .act-auto .act-dot { background: var(--volt); box-shadow: 0 0 0 2px #131726 inset; }
.act-texte { font-size: calc(14px * var(--k)); }
.act-meta { font-size: calc(12px * var(--k)); color: var(--muted); }

/* Barre d'outils, puces de filtre */
.barre-outils { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.barre-outils input[type=search] { flex: 1 1 260px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: calc(13px * var(--k)); font-weight: 600; cursor: pointer; color: var(--muted); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-btn); padding: calc(9px * var(--k)) 11px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

/* Listes clients */
.liste-cli { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--card-line); box-shadow: var(--shadow); border-radius: var(--r); overflow: hidden; }
.liste-cli li + li { border-top: 1px solid var(--line); }
.liste-cli a { display: grid; grid-template-columns: minmax(0, 2.2fr) 110px 120px 120px 120px; gap: 12px; align-items: center; padding: 12px 16px; color: var(--ink); }
.liste-cli a:hover { background: var(--surface-2); text-decoration: none; }
.lc-nom b { display: block; } .lc-nom span { color: var(--muted); font-size: calc(13px * var(--k)); }
.lc-num { text-align: right; font-variant-numeric: tabular-nums; font-size: calc(14px * var(--k)); }
.lbl { display: none; color: var(--muted); font-size: calc(12px * var(--k)); font-weight: 400; }
.liste-simple { list-style: none; margin: 0; padding: 0; }
.liste-simple li + li { border-top: 1px solid var(--line); }
.liste-simple a, .liste-simple button { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 10px 0; text-align: left; background: none; border: 0; color: var(--ink); cursor: pointer; }
.liste-simple.carte a { padding: 10px 2px; }
.liste-simple a:hover, .liste-simple button:hover { text-decoration: none; color: var(--link); }
.liste-simple span { display: flex; flex-direction: column; min-width: 0; }
.liste-simple small { color: var(--muted); font-size: calc(12.5px * var(--k)); }
.liste-simple .droite { align-items: flex-end; flex: none; text-align: right; gap: 2px; font-variant-numeric: tabular-nums; }
dl.infos { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
dl.infos dt { font-size: calc(12px * var(--k)); color: var(--muted); }
dl.infos dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.form-note { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.ligne-form { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
.ligne-form > input { flex: 1 1 200px; }

/* Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.kcol header { display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); }
.kcol h3 { font-size: calc(14px * var(--k)); }
.kcol header span { font-size: calc(12px * var(--k)); color: var(--muted); font-variant-numeric: tabular-nums; }
.kcol-corps { display: flex; flex-direction: column; gap: 8px; }
.kcarte { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--ink); }
.kcarte:hover { border-color: var(--link); text-decoration: none; }
.kcarte-alerte { border-left: 3px solid var(--warn); }
.k-client { font-size: calc(12px * var(--k)); color: var(--muted); }
.k-titre { font-weight: 600; font-size: calc(14px * var(--k)); line-height: 1.3; margin: 2px 0 6px; }
.k-pied { display: flex; justify-content: space-between; gap: 6px; font-size: calc(12.5px * var(--k)); font-variant-numeric: tabular-nums; }
.k-mt { font-weight: 700; } .k-age { color: var(--muted); }
.k-tache { margin-top: 6px; font-size: calc(12px * var(--k)); font-weight: 600; color: var(--warn); }
.kvide { color: var(--muted); text-align: center; padding: 10px; }

/* Affaire */
.etapes { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; }
.etapes li { flex: 1 0 auto; text-align: center; font-size: calc(12px * var(--k)); font-weight: 600; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; white-space: nowrap; }
.etapes li.passe { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.etapes li.actuelle { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lignes { display: flex; flex-direction: column; gap: 8px; }
.lg { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.lg-des { width: 100%; font-weight: 500; }
.lg-des-txt { font-weight: 500; font-size: calc(14px * var(--k)); }
.lg-nums { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: calc(13px * var(--k)); color: var(--muted); }
.lg-nums label { display: flex; align-items: center; gap: 6px; }
.lg-nums input { width: 92px; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.lg-u { min-width: 44px; }
.lg-tot { margin-left: auto; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.lg-fige .lg-nums span { font-variant-numeric: tabular-nums; }
.ajout { display: flex; gap: 8px; flex-wrap: wrap; }
.ajout select { flex: 1 1 260px; max-width: 100%; }
dl.totaux { margin: 0; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
dl.totaux div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
dl.totaux dt { color: var(--muted); } dl.totaux dd { margin: 0; font-weight: 600; }
dl.totaux .ttc dt, dl.totaux .ttc dd { color: var(--ink); font-weight: 800; font-size: calc(17px * var(--k)); font-family: var(--font-display); }
dl.totaux .marge { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: calc(13px * var(--k)); }
.ia { border: 1px dashed var(--link); border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
.ia[open] { gap: 8px; }
.ia summary { cursor: pointer; font-weight: 650; color: var(--link); }
.ia > *:not(summary) { margin-top: 8px; }
.ia .btn { align-self: flex-start; }
.notes { min-height: 70px; }

/* Factures */
.liste-fact { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--card-line); box-shadow: var(--shadow); border-radius: var(--r); overflow: hidden; }
.liste-fact li + li { border-top: 1px solid var(--line); }
.ligne-fact { width: 100%; display: grid; grid-template-columns: 130px minmax(0, 1fr) 130px 130px 110px; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.ligne-fact:hover { background: var(--surface-2); }
.ligne-fact small { display: block; color: var(--muted); font-size: calc(12.5px * var(--k)); }
.lf-mt { text-align: right; font-variant-numeric: tabular-nums; }
.lf-st { text-align: right; }
.fact-entete { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fact-grille { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.h3 { font-size: calc(14px * var(--k)); margin-bottom: 8px; }
.paiements { list-style: none; margin: 0; padding: 0; }
.paiements li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: calc(14px * var(--k)); }
.form-paie, .form { display: flex; flex-direction: column; gap: 10px; }
.champ { display: flex; flex-direction: column; gap: 4px; font-size: calc(13px * var(--k)); font-weight: 600; color: var(--muted); flex: 1 1 140px; }
.champ input, .champ select, .champ textarea { color: var(--ink); font-weight: 400; font-size: calc(15px * var(--k)); }

/* Catalogue */
.liste-cat { list-style: none; margin: 0; padding: 0; }
.liste-cat li + li { border-top: 1px solid var(--line); }
.liste-cat button { width: 100%; display: grid; grid-template-columns: 80px minmax(0, 1fr) 150px 56px; gap: 12px; align-items: center; padding: 9px 2px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.liste-cat button:hover { color: var(--link); }
.lc-code { font-weight: 700; font-size: calc(13px * var(--k)); color: var(--muted); }
.lc-pu { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.lc-pu small { color: var(--muted); font-weight: 400; margin-left: 3px; }
.lc-marge { text-align: right; font-variant-numeric: tabular-nums; font-size: calc(13px * var(--k)); color: var(--ok); font-weight: 600; }
.lc-marge.orange { color: var(--warn); }

/* Automatisations */
.grille-regles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.regle.off { opacity: 0.6; }
.regle p { font-size: calc(14px * var(--k)); }
.regle-n { font-size: calc(13px * var(--k)); color: var(--muted); margin-top: auto; }
.params { display: flex; gap: 10px; flex-wrap: wrap; }
.params label { display: flex; align-items: center; gap: 6px; font-size: calc(13px * var(--k)); color: var(--muted); }
.params input { width: 72px; padding: 6px 8px; }
.switch { position: relative; display: inline-flex; cursor: pointer; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span[aria-hidden] { width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.15s; }
.switch span[aria-hidden]::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.resume { white-space: pre-wrap; font: 14px/1.6 var(--font-body); margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.puces { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: calc(14px * var(--k)); }

/* Document */
/* Documents (devis, bons, factures, avoirs) : mise en page reprise de la facture Ciel d'Electropack */
.doc { position: relative; background: #fff; color: #161a26; border: 1px solid #d9dde6; border-radius: 6px; padding: 26px; font-size: calc(13px * var(--k)); overflow: hidden; }
.doc-fil { position: absolute; top: 46%; left: -10%; right: -10%; text-align: center; transform: rotate(-18deg); font: 800 44px var(--font-display); color: rgba(190, 51, 40, 0.09); pointer-events: none; letter-spacing: 0.08em; }
.doc-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.doc-marque { width: min(212px, 100%); text-align: center; color: #5c6474; line-height: 1.35; }
.doc-logo-img { max-height: 78px; max-width: 180px; object-fit: contain; display: block; margin: 0 auto 6px; }
.doc-sans-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
.doc-sans-logo b { color: #12294D; font: 800 20px var(--font-display); letter-spacing: 0.04em; }
.doc-logo { width: 42px; height: 42px; border-radius: 8px; background: #12294D; display: grid; place-items: center; flex: none; }
.doc-logo .bolt { fill: #F97316; }
.doc-act { font-size: calc(11px * var(--k)); }
.doc-bande { margin-top: 5px; background: #12294D; color: #fff; border-radius: 4px; padding: 3px 6px; font-size: calc(9.5px * var(--k)); font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; text-transform: uppercase; }
.doc-site { margin-top: 5px; color: #12294D; font-weight: 700; font-size: calc(12px * var(--k)); }
.doc-devise { font-size: calc(10px * var(--k)); letter-spacing: 0.12em; text-transform: uppercase; }
.doc-droite { flex: 1 1 290px; max-width: 430px; margin-left: auto; display: flex; flex-direction: column; gap: 16px; }
.doc-cases { display: grid; grid-template-columns: 1.35fr 1fr 0.9fr; gap: 8px; }
.doc-cases div { border: 1.2px solid #2c303a; border-radius: 7px; overflow: hidden; text-align: center; }
.doc-cases span { display: block; background: #ececec; border-bottom: 1.2px solid #2c303a; padding: 4px 6px; font-weight: 700; font-size: calc(12px * var(--k)); }
.doc-cases b { display: block; padding: 5px 6px; font-size: calc(13px * var(--k)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc-client { position: relative; margin-left: auto; width: min(330px, 100%); padding: 10px 16px 4px; line-height: 1.45; }
.doc-client::before, .doc-client::after { content: ''; position: absolute; top: 0; width: 16px; height: 16px; border-top: 1.2px solid #2c303a; }
.doc-client::before { left: 0; border-left: 1.2px solid #2c303a; }
.doc-client::after { right: 0; border-right: 1.2px solid #2c303a; }
.doc-client b { display: block; font-size: calc(14px * var(--k)); }
.doc-client span { display: block; color: #5c6474; font-size: calc(12px * var(--k)); }
.doc-refs { margin: 16px 0 10px; line-height: 1.5; }
.doc-refs p:first-child { font-weight: 600; }
.doc-scroll { overflow-x: auto; }
.doc-cadre { border: 1.2px solid #2c303a; border-radius: 10px; overflow: hidden; min-width: 540px; }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th { background: #ececec; color: #161a26; text-align: center; font-weight: 700; padding: 6px 8px; font-size: calc(12px * var(--k)); border-bottom: 1.2px solid #2c303a; white-space: nowrap; }
.doc-table th + th, .doc-table td + td { border-left: 1.2px solid #2c303a; }
.doc-table td { padding: 6px 8px; vertical-align: top; }
.doc-table td small { color: #5c6474; font-size: 0.86em; }
.doc-table .ref { white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc-table .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc-vide td { height: 96px; }
.doc-bas { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
.doc-gauche { flex: 0 1 330px; }
.doc-tva { border-collapse: separate; border-spacing: 0; border: 1.2px solid #2c303a; border-radius: 8px; overflow: hidden; width: 100%; font-variant-numeric: tabular-nums; }
.doc-tva th { background: #ececec; font-weight: 700; padding: 6px 8px; font-size: calc(12px * var(--k)); border-bottom: 1.2px solid #2c303a; text-align: center; white-space: nowrap; }
.doc-tva td { padding: 7px 8px; text-align: center; white-space: nowrap; }
.doc-tva td.n { text-align: right; }
.doc-tva th + th, .doc-tva td + td { border-left: 1.2px solid #2c303a; }
.doc-banque { margin-top: 12px; font-weight: 700; line-height: 1.45; }
.doc-tot { flex: 0 1 300px; margin: 0 0 0 auto; border: 1.2px solid #2c303a; border-radius: 8px; overflow: hidden; }
.doc-tot div { display: grid; grid-template-columns: 44% 1fr; font-variant-numeric: tabular-nums; }
.doc-tot dt { background: #ececec; padding: 6px 10px; }
.doc-tot dd { margin: 0; padding: 6px 10px; text-align: right; white-space: nowrap; }
.doc-tot .gras { font-weight: 800; }
.doc-tot .trait dd { border-bottom: 1.2px solid #2c303a; }
.doc-lettres { margin-top: 14px; font-size: calc(12.5px * var(--k)); }
.doc-cond { margin-top: 8px; font-size: calc(12px * var(--k)); color: #5c6474; }
.doc-accord { margin: 14px 0 0 auto; width: min(300px, 100%); height: 104px; border: 1px solid #d9dde6; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: calc(12px * var(--k)); color: #6b7182; }
.doc-accord b { color: #161a26; font-size: calc(13px * var(--k)); }
.doc-pied { margin-top: 22px; text-align: center; color: #12294D; font-weight: 700; font-size: calc(11.5px * var(--k)); line-height: 1.5; }
@media (max-width: 719px) { .doc-marque { margin: 0 auto; } .doc-droite { max-width: none; } .doc-cases { grid-template-columns: 1fr 1fr; } .doc-cases div:first-child { grid-column: 1 / -1; } .doc-tot { flex-basis: 100%; } .doc-gauche { flex-basis: 100%; } }

/* Fenêtres et messages */
#fenetre { position: fixed; inset: 0; z-index: 50; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; padding: 16px; }
.fen-fond { position: absolute; inset: 0; background: rgba(10, 12, 24, 0.55); }
.fen { position: relative; background: var(--surface); border-radius: 12px; width: min(560px, 100%); max-height: calc(100% - 8px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.fen-large { width: min(1040px, 100%); }
.fen-tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.fen-tete h2 { font-size: calc(17px * var(--k)); }
.fen-corps { padding: 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.fen-corps > * { flex: none; }
.fen-pied { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.msg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
#msg-texte { font-size: calc(14px * var(--k)); line-height: 1.5; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #23313A; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: calc(14px * var(--k)); z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.25); max-width: calc(100% - 32px); }

/* Profil, réglages, compléments v2 */
.profil { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--side-line); border-radius: var(--r-btn); background: var(--side-hover); cursor: pointer; text-align: left; width: 100%; }
.profil:hover { border-color: var(--side-on-ink); }
.profil-init { width: 30px; height: 30px; border-radius: 50%; background: var(--avatar-bg); color: var(--avatar-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
.profil-txt { display: flex; flex-direction: column; line-height: 1.2; }
.profil-txt small { color: var(--side-muted); font-size: calc(11px * var(--k)); }
.profil-txt b { color: var(--side-ink); font-size: calc(14px * var(--k)); }
.choix-profil { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.choix-profil .btn { flex-direction: column; align-items: flex-start; padding: 14px; white-space: normal; text-align: left; }
.choix-profil .btn small { font-weight: 400; opacity: 0.85; }
.resp { display: inline-block; font-size: calc(11px * var(--k)); font-weight: 600; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.resp-moi { background: var(--accent-soft); color: var(--accent); }
.resp-autre { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.suivi { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.suivi label { display: flex; align-items: center; gap: 6px; font-size: calc(13px * var(--k)); color: var(--muted); }
.suivi select { padding: 5px 8px; font-size: calc(13px * var(--k)); }
.params select { padding: 6px 8px; }
.grille-champs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.champ-large { grid-column: 1 / -1; }
.case { display: flex; align-items: center; gap: 8px; font-size: calc(14px * var(--k)); grid-column: 1 / -1; }
.case input { width: 18px; height: 18px; }
.fen-pied-haut { justify-content: flex-start; padding: 0; }

/* v3 : recherche, pièces, planning, apparence, logo */

.progres { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }

.ev + .ev { border-top: 1px solid var(--line); }
.ev a, .ev button { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 9px 0; background: none; border: 0; text-align: left; color: var(--ink); cursor: pointer; }
.ev a:hover, .ev button:hover { text-decoration: none; color: var(--link); }
.ev-date { display: flex; flex-direction: column; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 3px 0; line-height: 1.15; color: var(--ink); }
.ev-date b { font-family: var(--font-display); font-size: calc(17px * var(--k)); }
.ev-date small { color: var(--muted); font-size: calc(11px * var(--k)); }
.ev-corps { display: flex; flex-direction: column; min-width: 0; }

.groupe-titre { font-family: var(--font-body); font-size: calc(12px * var(--k)); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.chantiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.chantier { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-btn); color: var(--ink); background: var(--surface-2); }

.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.look-carte { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 10px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; color: var(--ink); }

.look-apercu { display: grid; grid-template-columns: 26% 1fr; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.la-cote { background: var(--side-bg); border-right: 1px solid var(--side-line); display: flex; flex-direction: column; gap: 5px; padding: 8px 6px; }
.la-cote i { height: 6px; border-radius: 3px; background: var(--side-muted); opacity: 0.4; }
.la-cote i:first-child { height: 9px; opacity: 1; background: var(--side-on-bg); box-shadow: inset 3px 0 0 var(--side-on-bar); outline: 1px solid var(--side-line); }
.la-corps { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.la-corps b { font-family: var(--font-display); color: var(--ink); font-size: 15px; line-height: 1.1; text-transform: var(--h2-case); }
.la-ligne { width: 90%; height: 14px; border-radius: calc(var(--r) / 3); background: var(--surface); border: 1px solid var(--card-line); box-shadow: var(--shadow); }
.la-btn { width: 46%; height: 11px; border-radius: calc(var(--r-btn) / 2); background: var(--accent); margin-top: 2px; }
.marque-logo img, .logo-apercu img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.marque-logo.avec-img { background: #fff; padding: 4px 6px; width: auto; height: 46px; max-width: 110px; }
.marque-logo.avec-img img { height: 38px; width: auto; max-width: 98px; }
/* Le logo porte déjà le nom : on ne le répète pas à côté */
.marque b[hidden] { display: none; }
.marque b[hidden] + small { white-space: normal; line-height: 1.25; }

label.btn { cursor: pointer; }

.ligne-form .champ { flex: 1 1 130px; }

  .looks { grid-template-columns: minmax(0, 1fr); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Annonce de nouveaux exemples, en tête du tableau de bord */

/* ---------- Aide : bouton flottant, panneau, guide, demandes ---------- */

.aide-btn:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
.aide { position: fixed; right: 18px; bottom: 18px; z-index: 45; width: min(410px, calc(100vw - 36px)); height: min(640px, calc(100vh - 36px)); height: min(640px, calc(100dvh - 36px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(10, 12, 24, 0.3); display: flex; flex-direction: column; overflow: hidden; }

.aide-pied .btn { width: 100%; justify-content: center; }

.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 0 12px; }
.guide summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
.guide ol { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Icônes ---------- */
.ico { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
.nav-lbl { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.nav .ico { width: 19px; height: 19px; opacity: 0.85; }
.nav a.on .ico { opacity: 1; }
.carte h2, .fen-corps h3 { display: flex; align-items: center; gap: 8px; }
.carte h2 .ico { width: 18px; height: 18px; color: var(--link); }
.btn .ico { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
.kpi { position: relative; }
.kpi-lbl { padding-right: 42px; }
.kpi-ico { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--link); }
.kpi-ico .ico { width: 18px; height: 18px; }
.ton-ok { background: var(--ok-soft); color: var(--ok); } .ton-warn { background: var(--warn-soft); color: var(--warn); } .ton-bad { background: var(--bad-soft); color: var(--bad); } .ton-info { background: var(--info-soft); color: var(--info); }
.liste-simple .ligne-ico { flex: none; flex-direction: row; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); align-self: center; }
.liste-simple .ligne-ico + span { flex: 1 1 auto; }
.ligne-ico .ico { width: 16px; height: 16px; }
@media (max-width: 820px) { .nav .ico { width: 17px; height: 17px; } .nav-lbl { gap: 6px; } }
@media (max-width: 480px) { .kpi-ico { width: 28px; height: 28px; top: 9px; right: 9px; border-radius: 8px; } .kpi-ico .ico { width: 15px; height: 15px; } .kpi-lbl { padding-right: 32px; } }

/* Chiffres cliquables : cases, étapes et mois du graphique ouvrent leur détail */
.kpi-btn { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
.kpi-btn .kpi-lbl, .kpi-btn .kpi-val, .kpi-btn .kpi-sub { display: block; max-width: 100%; }
.kpi-voir { display: flex; align-items: center; gap: 2px; margin-top: auto; padding-top: 8px; font-size: calc(12.5px * var(--k)); font-weight: 600; color: var(--link); }
.kpi-voir .ico { width: 14px; height: 14px; transition: transform .15s; }
.kpi-btn:hover { border-color: var(--accent); box-shadow: 0 6px 16px rgba(35, 49, 58, 0.10); transform: translateY(-1px); }

.bar-g { cursor: pointer; outline: none; }

.bar-g:focus-visible .bar-zone { stroke: var(--accent); stroke-width: 2; }

.detail-h3 { margin: 6px 0 0; }
.retour-detail { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-weight: 600; min-height: 32px; }

@media (max-width: 480px) { .kpi-voir { padding-top: 6px; } .retour-detail { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) { .kpi-btn, .kpi-voir .ico { transition: none; } .kpi-btn:hover { transform: none; } .kpi-btn:hover .kpi-voir .ico { transform: none; } }

.suivi-dl dt small { display: block; font-size: calc(12.5px * var(--k)); }

/* Employés, état de paie et saisie par photo */
.mois-choix { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.mois-choix b { min-width: 150px; text-align: center; font-family: var(--font-display); font-size: calc(17px * var(--k)); }
.mois-choix .btn { min-width: 40px; justify-content: center; padding-left: 8px; padding-right: 8px; }
.table-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.etat-paie { width: 100%; border-collapse: collapse; font-size: calc(13.5px * var(--k)); font-variant-numeric: tabular-nums; }
.etat-paie th, .etat-paie td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.etat-paie th { color: var(--muted); font-weight: 600; font-size: calc(12.5px * var(--k)); }
.etat-paie .num { text-align: right; }
.etat-paie tr.total td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
.champ.case { flex-direction: row; align-items: center; gap: 8px; align-self: end; min-height: 44px; }
.champ.case input { width: 18px; height: 18px; flex: none; }
.photo-bloc { border: 1px dashed var(--line); border-radius: var(--r-btn); padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.photo-boutons { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-bloc .carte-note { margin: 0; }
.photo-etat { margin: 0; font-size: calc(13.5px * var(--k)); font-weight: 600; color: var(--warn); }
.photo-etat:empty { display: none; }
.photo-etat.ok { color: var(--ok); }
@media (max-width: 480px) { .mois-choix { justify-content: space-between; } .mois-choix .btn { min-height: 44px; min-width: 44px; } .photo-boutons .btn { flex: 1 1 auto; } }

.champ-cmd { margin-top: 12px; }

/* Bons de livraison des fournisseurs */
.blf-lignes { display: grid; gap: 10px; }
.blf-l { display: grid; grid-template-columns: minmax(180px, 3fr) 1fr 1.2fr 0.8fr minmax(150px, 2fr) auto; gap: 8px; align-items: end; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.blf-l .champ { margin: 0; min-width: 0; }
.blf-l .btn-x { margin-bottom: 4px; }
.blf-total { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm, 8px); background: var(--surface-2, rgba(0, 0, 0, 0.04)); font-variant-numeric: tabular-nums; }
.table-blf td small { display: block; color: var(--muted); font-size: 0.86em; margin-top: 2px; }
.table-blf td small.rouge, .liste-simple small .rouge { color: var(--bad); font-weight: 600; }
.liste-coche { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
.liste-coche label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); cursor: pointer; font-variant-numeric: tabular-nums; }
.liste-coche label small { display: block; color: var(--muted); }
.liste-coche input { width: 20px; height: 20px; }
.regroup-ctrl { margin: 10px 0; padding: 10px 12px; border-radius: var(--r-sm, 8px); background: var(--surface-2, rgba(0, 0, 0, 0.04)); }
.regroup-ctrl.ok { box-shadow: inset 3px 0 0 var(--ok); }
.regroup-ctrl.alerte { box-shadow: inset 3px 0 0 var(--bad); }
/* Attestation de régularité fiscale et ordres de virement */
.alerte-att { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; padding: 10px 12px; border-radius: var(--r-sm, 8px); background: var(--surface-2, rgba(0, 0, 0, 0.04)); line-height: 1.45; }
.alerte-att .ico { flex: none; margin-top: 2px; }
.alerte-att.att-bad { box-shadow: inset 3px 0 0 var(--bad); }
.alerte-att.att-warn { box-shadow: inset 3px 0 0 var(--warn); }
.alerte-att.att-ok { box-shadow: inset 3px 0 0 var(--ok); }
.ordres { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 8px; }
.ordre { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm, 8px); }
.ordre > span:first-child { flex: 1 1 160px; }
.ordre small { display: block; color: var(--muted); }
.ordre-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.doc.lettre { max-width: 720px; margin: 0 auto; line-height: 1.55; }
.lettre-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.lettre-tete .doc-logo-img { margin: 0; }
.lettre-titre { text-align: center; text-transform: uppercase; letter-spacing: 0.06em; font: 800 18px var(--font-display); margin: 18px 0 14px; color: #161a26; }
.lettre-dl { margin: 14px 0; display: grid; gap: 8px; }
.lettre-dl div { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 12px; }
.lettre-dl dt { color: #5c6474; }
.lettre-dl dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.lettre-bas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
.lettre-bas div { border: 1.2px solid #2c303a; border-radius: 8px; min-height: 96px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.lettre-bas span { color: #5c6474; }
/* Pointage par chantier */
.jours-chantiers { border: 1px solid var(--line); border-radius: var(--r-sm, 8px); padding: 10px 12px; margin: 0 0 12px; display: grid; gap: 8px; }
.jours-chantiers legend { padding: 0 6px; font-weight: 600; }
.jours-ch { display: grid; grid-template-columns: 1fr 96px; gap: 12px; align-items: center; margin: 0; }
.jours-ch span small { display: block; color: var(--muted); font-weight: 400; }
.jours-ch input { text-align: right; }
.mois-choix b small { display: block; font-weight: 400; color: var(--muted); font-size: 0.82em; }
.photo-pointage { margin-bottom: 14px; }
.infos select { min-height: 40px; max-width: 100%; }
@media (max-width: 719px) {
  .blf-l { grid-template-columns: 1fr 1fr; }
  .blf-l .blf-des, .blf-l .blf-ch { grid-column: 1 / -1; }
  .blf-l .btn-x { justify-self: end; }
  .lettre-bas { grid-template-columns: 1fr; }
  .lettre-dl div { grid-template-columns: 1fr; gap: 0; }
}
/* Dans un formulaire en colonne, un champ garde sa hauteur naturelle (la base de 140 px ne vaut que pour les champs côte à côte). */
.form > .champ, .form-paie > .champ { flex: 0 0 auto; }
.photo-boutons .btn { white-space: normal; text-align: left; }
.liste-simple small.rouge { color: var(--bad); font-weight: 600; }

/* Connexion et comptes */
body.hors-session .cote, body.hors-session .aide-btn { display: none; }
body.hors-session .app { display: block; }
.connexion { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.connexion-carte { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card, 14px); padding: 28px; display: grid; gap: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06); }
.connexion-marque { display: flex; align-items: center; gap: 12px; }
.connexion-marque b { display: block; font: 800 22px var(--font-display); letter-spacing: 0.02em; }
.connexion-marque small { color: var(--muted); }
.connexion h1 { font-size: calc(24px * var(--k)); margin: 0; }
.comptes { display: grid; gap: 10px; }
.compte { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; min-height: 64px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-btn, 10px); background: var(--surface); color: inherit; cursor: pointer; font: inherit; }
.compte:hover, .compte:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.compte .profil-init { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; }
.compte-txt b { display: block; font-size: calc(16px * var(--k)); }
.compte-txt small { display: block; color: var(--muted); line-height: 1.4; }
.compte-txt .compte-ecrans { margin-top: 4px; color: inherit; opacity: 0.82; }
.compte > .ico { color: var(--muted); }
.nav-sep { display: block; margin: 10px 8px 2px; font-size: calc(11px * var(--k)); letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); }
.nav-tout { display: flex; align-items: center; width: 100%; margin-top: 6px; padding: 9px 10px; border: 1px dashed var(--side-line); border-radius: var(--r-btn, 10px); background: transparent; color: var(--side-muted); font: inherit; cursor: pointer; text-align: left; }
.nav-tout:hover, .nav-tout:focus-visible { color: var(--side-ink); background: var(--side-hover); outline: none; }
.table-acces select { min-height: 40px; max-width: 100%; }
.table-acces td, .table-acces th { white-space: nowrap; }
@media (max-width: 899px) { .nav-sep { display: none; } .nav-tout { width: auto; margin-top: 0; white-space: nowrap; flex: none; } }

/* ---------- Version 4.2 : tâches datées, « Payer quand même », grille de quinzaine, banque ---------- */
.echeance { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 0 6px; font-weight: 600; font-size: calc(12px * var(--k)); white-space: nowrap; vertical-align: 1px; }
.echeance .ico { width: 13px; height: 13px; }
.ech-neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.ech-warn { background: var(--warn-soft); color: var(--warn); }
.ech-bad { background: var(--bad-soft); color: var(--bad); }
.btn-alerte { background: var(--bad); border-color: var(--bad); color: #fff; }
.vert { color: var(--ok); }
.kpis-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis-3 .kpi-val { font-size: calc(30px * var(--k)); }
.etats-q { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; font-size: calc(12px * var(--k)); font-weight: 600; }
.etats-q li { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.etats-q li.fait { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.etats-q li.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.grille { border-collapse: separate; border-spacing: 0; font-size: calc(13px * var(--k)); font-variant-numeric: tabular-nums; }
.grille th, .grille td { padding: 2px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grille thead th { font-weight: 600; color: var(--muted); padding: 4px 2px 6px; min-width: 40px; }
.grille thead th small { display: block; font-weight: 400; font-size: 0.82em; }
.grille thead th.gj-dim { color: var(--muted); opacity: 0.6; }
.grille thead th.gj-ferie { color: var(--info); }
.grille thead th.gj-auj { box-shadow: inset 0 -2px 0 var(--accent); color: var(--ink); }
.grille tbody th, .grille thead th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding: 4px 10px 4px 0; min-width: 132px; max-width: 170px; white-space: normal; font-weight: 600; }
.grille tbody th small { display: block; font-weight: 400; color: var(--muted); font-size: 0.86em; }
.grille td.num, .grille th.num { text-align: right; padding: 4px 6px; font-weight: 600; min-width: 62px; }
.gj { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: calc(12.5px * var(--k)); padding: 0; }
button.gj { cursor: pointer; }
button.gj:hover:not(:disabled) { border-color: var(--ink); }
button.gj:disabled { cursor: default; opacity: 0.75; }
.gj-vide { border-style: dashed; }
.gj-T { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.gj-A { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.gj-F { background: var(--info); color: var(--surface); border-color: transparent; }
.gj-P { background: var(--info-soft); color: var(--info); border-color: transparent; }
.gj-C { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.legende { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 0; padding: 0; font-size: calc(12.5px * var(--k)); color: var(--muted); }
.legende li { display: inline-flex; align-items: center; gap: 6px; }
.legende .gj { width: 26px; height: 26px; font-size: calc(11px * var(--k)); border-radius: 6px; }
.grille-mini thead th { min-width: 34px; }
.grille-mini .gj { width: 32px; height: 32px; }
.carte-grille .carte-boutons { margin-top: 12px; justify-content: flex-end; }
.carte-grille + .liste-fact { margin-top: 14px; }
.mail-ex { border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--surface-2); padding: 10px 12px; }
.mail-ex p { margin: 0; display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
.mail-ex p + p { margin-top: 6px; display: block; }
.attente { list-style: none; margin: 0; padding: 0; }
.attente li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.attente small { display: block; color: var(--muted); font-size: calc(12.5px * var(--k)); }
.att-mt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.liste-ech { box-shadow: none; }
.liste-ech a.ligne-fact { color: var(--ink); text-decoration: none; }
.releve td { white-space: normal; vertical-align: middle; }
.releve td:first-child, .releve td.num { white-space: nowrap; }
.releve-note { min-height: 36px; width: min(260px, 100%); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); color: var(--ink); font: inherit; }
.releve-piece .btn { margin-left: 4px; }
.ferie-l { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.ferie-l > span:nth-child(2) { flex: 1; min-width: 0; }
.ferie-l small { display: block; color: var(--muted); font-size: calc(12.5px * var(--k)); }
@media (max-width: 900px) { .kpis-3 { grid-template-columns: 1fr; } }
@media (max-width: 480px) {
  .gj { width: 44px; height: 44px; } .grille thead th { min-width: 48px; } .grille-mini .gj { width: 36px; height: 36px; } .grille-mini thead th { min-width: 40px; }
  .grille tbody th, .grille thead th:first-child { min-width: 104px; max-width: 120px; }
  .attente li { grid-template-columns: minmax(0, 1fr) auto; } .attente li .btn { grid-column: 1 / -1; min-height: 44px; justify-content: center; }
  .carte-grille .carte-boutons .btn { flex: 1 1 auto; min-height: 44px; }
}

/* ---------- Version 4.3 : documents à classer ---------- */
.docs { list-style: none; margin: 0; padding: 0; }
.doc-l { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.doc-l:first-child { border-top: 0; }
.doc-nom, .doc-prop, .doc-l .tache-detail { margin: 0; }
.doc-prop { margin-top: 4px; font-size: calc(13.5px * var(--k)); }
.doc-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 190px; }
.doc-actions select { min-height: 36px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; padding: 4px 6px; max-width: 100%; }
.doc-ou { white-space: nowrap; }
@media (max-width: 640px) { .doc-l { grid-template-columns: auto minmax(0, 1fr); } .doc-actions { grid-column: 1 / -1; min-width: 0; } .doc-actions .btn, .doc-actions select { min-height: 44px; } .doc-ou { white-space: normal; } }

/* ---------- Version 4.4 : prompt pour AutoCAD ---------- */
.prompt-mode { margin: 0 0 14px; padding-left: 20px; font-size: calc(13.5px * var(--k)); }
.prompt-mode li { margin: 4px 0; }
.prompt-texte { width: 100%; min-height: 340px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: calc(12.5px * var(--k)); line-height: 1.5; }
.prompt-etat { margin: 6px 0 0; font-size: calc(12.5px * var(--k)); color: var(--muted); }
.prompt-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
@media (max-width: 480px) { .prompt-actions .btn { flex: 1 1 100%; min-height: 44px; justify-content: center; } }

/* ---------- Version 4.5 : devis préparé, dossier tarifaire, gagné ou perdu ---------- */
.kpis-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lg-marge { margin: 0; display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; font-size: calc(12.5px * var(--k)); color: var(--muted); font-variant-numeric: tabular-nums; }
.lg-badges, .lc-badges { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
dl.totaux .marge + .marge { margin-top: 0; padding-top: 0; border-top: 0; }
.avant-envoi { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 10px 12px; border-radius: var(--r-btn); background: var(--ok-soft); color: var(--ink); font-size: calc(14px * var(--k)); line-height: 1.45; }
.avant-envoi .ico { width: 18px; height: 18px; margin-top: 2px; color: var(--ok); }
.avant-envoi.alerte { background: var(--warn-soft); }
.avant-envoi.alerte .ico { color: var(--warn); }
.avant-envoi b { font-variant-numeric: tabular-nums; }
#avant-envoi:empty { display: none; }
.assiste { border: 1px dashed var(--link); border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
.assiste .carte-note { margin: 0; color: var(--ink); }
.assiste .btn .ico, .dv-modes .ico { width: 15px; height: 15px; }
.dv { display: flex; flex-direction: column; gap: 12px; }
.dv > .carte-note, .dv p { margin: 0; }
.dv-modes .chip { display: inline-flex; align-items: center; gap: 6px; }
.dv-saisie, .dv-rapide { display: flex; flex-direction: column; gap: 10px; }
.dv-saisie textarea { width: 100%; }
.dv-types { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.dv-type { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-btn); padding: 10px 12px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 2px; font: inherit; }
.dv-type:hover { border-color: var(--accent); }
.dv-type small { color: var(--muted); font-size: calc(12.5px * var(--k)); }
.dv-prop { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.dv-prop .carte-tete { margin: 0; }
.dv-prop .h3 { margin: 0; }
.tab-postes { width: 100%; border-collapse: collapse; font-size: calc(13.5px * var(--k)); font-variant-numeric: tabular-nums; }
.tab-postes caption { text-align: left; font-weight: 650; padding-bottom: 6px; color: var(--muted); font-size: calc(13px * var(--k)); }
.tab-postes th, .tab-postes td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tab-postes thead th { color: var(--muted); font-weight: 600; font-size: calc(12.5px * var(--k)); }
.tab-postes .num { text-align: right; white-space: nowrap; }
.tab-postes tbody th { font-weight: 500; }
.tab-postes tfoot th, .tab-postes tfoot td { font-weight: 700; border-bottom: 0; }
.tab-postes td small { display: block; color: var(--muted); font-size: calc(12px * var(--k)); }
.dv-tab input { width: 100%; min-width: 0; padding: 6px 8px; }
.dv-tab td.num input { width: 96px; text-align: right; }
.dv-tab td:first-child { min-width: 230px; }
.dv-tab td small { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.dv-tab td.dv-m small { display: block; margin-top: 0; }
.dv-b { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.resultat { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: var(--r-btn); background: var(--surface-2); padding: 12px 14px; color: var(--ink); margin-bottom: 10px; font: inherit; }
.resultat:hover { border-color: var(--accent); }
.res-lbl { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 750; font-size: calc(22px * var(--k)); font-variant-numeric: tabular-nums; }
.res-lbl .ico { width: 22px; height: 22px; }
.res-phrase { font-size: calc(13.5px * var(--k)); color: var(--muted); line-height: 1.45; }
.resultat.res-ok { border-left-color: var(--ok); } .res-ok .res-lbl { color: var(--ok); }
.resultat.res-bad { border-left-color: var(--bad); } .res-bad .res-lbl { color: var(--bad); }
.resultat.res-info { border-left-color: var(--info); } .res-info .res-lbl { color: var(--info); }
.resultat.res-muted { border-left-color: var(--line); } .res-muted .res-lbl { color: var(--muted); }
.res-badge { display: inline-flex; align-items: center; font-weight: 750; font-size: calc(13px * var(--k)); padding: 2px 9px; border-radius: var(--r-pill); font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-badge.res-ok { background: var(--ok-soft); color: var(--ok); }

/* Données fictives et calculs partagés (utilisés par la page et par le script d'amorçage de la base). */
const TVA = 0.20;

function addDaysISO(iso, n) {
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
function ligneHT(l) { return Math.round((Number(l.qte) || 0) * (Number(l.pu) || 0) * 100 * (1 - (Number(l.remise) || 0) / 100)); }
/* Remise globale en % appliquée aux lignes, sauf celles marquées horsRemise (déduction d'acompte). */
function totaux(lignes, remisePct) {
  let base = 0, hors = 0;
  (lignes || []).forEach(l => { if (l.horsRemise) hors += ligneHT(l); else base += ligneHT(l); });
  const remise = Math.round(base * (Number(remisePct) || 0) / 100);
  const ht = base - remise + hors;
  const tva = Math.round(ht * TVA);
  return { brut: base + hors, remise, ht, tva, ttc: ht + tva };
}
function coutTotal(lignes) {
  return (lignes || []).reduce((s, l) => s + Math.round((Number(l.qte) || 0) * (Number(l.cout) || 0) * 100), 0);
}

function estFerie(iso, mobiles) {

// Jours d'une quinzaine (AAAA-MM-1 : du 1er au 15, AAAA-MM-2 : du 16 à la fin du mois)
function joursQuinzaine(q) {
  const m = q.slice(0, 7), fin = q.endsWith('-1') ? 15 : new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate(), out = [];
  for (let j = q.endsWith('-1') ? 1 : 16; j <= fin; j++) out.push(m + '-' + String(j).padStart(2, '0'));
  return out;
}

// On pose `travailles` jours T, puis `conges` jours C ; le reste des jours ouvrés est « absent » si `finir`, vide sinon. Rien après `jusqua`.
function grilleExemple(q, travailles, conges, jusqua, o) {
  o = o || {}; let t = 0, c = 0;
  return joursQuinzaine(q).map(d => {
    if (d > jusqua || estDimanche(d)) return '.';
    if (estFerie(d, DEFAULT_FERIES.mobiles)) return o.ferieTravaille ? 'F' : 'P';
    if (t < travailles) { t++; return 'T'; }
    if (c < conges) { c++; return 'C'; }
    return o.finir ? 'A' : '.';
  }).join('');
}

/* Nombre en lettres (convention des factures marocaines) */
const U = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];

/* ---------- Enregistrement ---------- */
const fileEcriture = {};
function persist(coll, obj) {
  S[coll][obj.id] = obj;
  if (mode === 'db') ecrire(coll + '/' + obj.id, obj);
}
function persistParam(id) { if (mode === 'db') ecrire('parametres/' + id, S.params[id]); }
async function ecrire(path, data) {
  const q = fileEcriture[path] || (fileEcriture[path] = { enCours: false, suivant: null });
  q.suivant = clone(data);
  if (q.enCours) return;
  q.enCours = true;
  while (q.suivant) {
    const body = q.suivant; q.suivant = null;
    setSync('enreg');
    try { await db.doc(path).set(body); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { await db.doc(path).set(body); } catch (e2) { erreurEcriture(e2); } }
      else erreurEcriture(e);
    }
  }
  q.enCours = false;
  if (Object.values(fileEcriture).every(x => !x.enCours) && syncEtat === 'enreg') setSync('ok');
}
function erreurEcriture(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { setSync('lecture'); toast("Vous n'avez pas le droit de modifier ces données."); }
  else if (code === 'quota_exceeded') { setSync('erreur'); toast('La base est pleine : supprimez des éléments pour continuer.'); }
  else { setSync('erreur'); toast("Modification non enregistrée. Vérifiez la connexion puis réessayez."); }
}

const ETAPES = [['demande', 'Demande'], ['envoye', 'Devis envoyé'], ['accepte', 'Accepté'], ['chantier', 'En chantier'], ['termine', 'Terminé'], ['facture', 'Facturé'], ['paye', 'Payé']];

const affairesListe = () => Object.values(S.affaires);

  if (estAvoir(f)) return 'avoir';

  if (estAnnulee(f)) return 'annulee';
  if (r === 0) return 'payee';

}
const STATUT_FACT = { payee: ['Payée', 'ok'], retard: ['En retard', 'bad'], partielle: ['Partielle', 'warn'], attente: ['À encaisser', 'neutral'], avoir: ['Avoir', 'info'], annulee: ['Annulée', 'muted'], rembourser: ['Trop-perçu', 'warn'] };

const affFacturesValides = a => affFactures(a).filter(f => !estAvoir(f) && !estAnnulee(f));

  const tot = a.lignes.reduce((s, l) => s + Math.abs(ligneHT(l)), 0);

let TACHES = {};

      if (n >= R.demandeSansSuite.j) add({ key: 'demande_' + a.id, regle: 'demandeSansSuite', niveau: 2, titre: 'Planifier la visite', detail: `Demande reçue ${ago(D.demande)}, aucune visite prévue`, a, c, actions: ['visite', 'appel'] });
    }

      const n = daysBetween(D.envoi, TODAY);
      if (n >= R.relanceDevis.j2) add({ key: 'devis2_' + a.id, regle: 'relanceDevis', niveau: 3, titre: 'Appeler pour le devis', detail: `Devis envoyé ${ago(D.envoi)}, toujours sans réponse`, a, c, msg: 'devis2', actions: ['message', 'appel', 'fait'] });
      else if (n >= R.relanceDevis.j1) add({ key: 'devis1_' + a.id, regle: 'relanceDevis', niveau: 2, titre: 'Relancer le devis', detail: `Devis envoyé ${ago(D.envoi)}, pas de réponse`, a, c, msg: 'devis1', actions: ['message', 'fait'] });

      add({ key: 'acompte_' + a.id, regle: 'acompteAuto', niveau: 2, titre: "Créer la facture d'acompte", detail: `Devis accepté, acompte de ${R.acompteAuto.pct} % non facturé`, a, c, actions: ['acompte', 'fait'] });

      add({ key: 'bc_' + a.id, regle: 'bonCommandeAuto', niveau: 1, titre: 'Créer le bon de commande', detail: 'Devis accepté, bon de commande pas encore créé', a, c, actions: ['bc', 'fait'] });

function graphiqueCA() {
  const now = new Date(+TODAY.slice(0, 4), +TODAY.slice(5, 7) - 1, 1);
  const mois = [];
  for (let i = 5; i >= 0; i--) { const dt = new Date(now.getFullYear(), now.getMonth() - i, 1); mois.push(localISO(dt).slice(0, 7)); }
  const vals = mois.map(m => facturesListe().filter(f => f.date.slice(0, 7) === m).reduce((s, f) => s + htSigne(f), 0));
  const max = Math.max(...vals, 1), W = 360, H = 170, bw = 38, gap = (W - 6 * bw) / 6;
  const total = vals.reduce((s, v) => s + v, 0);
  const bars = vals.map((v, i) => {
    const h = Math.round(v / max * 110), x = gap / 2 + i * (bw + gap), y = 132 - h, cur = i === 5;
    const lbl = v ? (v / 100000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k' : '0';
    const [yy, mm] = mois[i].split('-');
    return `<g class="bar-g" data-act="detail" data-k="facture-mois" data-v="${mois[i]}" role="button" tabindex="0" aria-label="${MOIS_LONG[+mm - 1]} ${yy} : ${money(v)} HT. Voir le détail"><rect class="bar-zone" x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H - 8}" rx="6"/><rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="3" class="${cur ? 'bar-cur' : 'bar'}"><title>${MOIS_LONG[+mm - 1]} ${yy} : ${money(v)}</title></rect><text x="${x + bw / 2}" y="${y - 6}" class="bar-val">${lbl}</text><text x="${x + bw / 2}" y="152" class="bar-mois">${MOIS[+mm - 1]}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="graph" role="img" aria-label="Chiffre d'affaires facturé par mois">${bars}<line x1="0" y1="132.5" x2="${W}" y2="132.5" class="axe"/></svg><p class="carte-note">Total sur 6 mois : ${moneyRond(total)} HT, en milliers de DH. Cliquez sur un mois pour voir ses factures.</p>`;
}

/* ---------- Plan AutoCAD : prompt à coller dans Claude Desktop (version 4.4) ----------
   Le logiciel ne pilote pas AutoCAD et n'envoie rien. Il prépare un texte que Jacqui relit, puis colle lui-même

const TYPES_PLAN = {
  implantation: ['Plan d’implantation (prises, éclairage, courants faibles)', 'implantation', 'Placer sur le plan de départ, pièce par pièce, les points prévus au devis : prises et postes de travail, luminaires et blocs de sécurité, prises RJ45, caméras, lecteurs de badge, détecteurs.'],

  synoptique: ['Synoptique des courants faibles', 'synoptique', 'Dessiner le synoptique des courants faibles prévus au devis : baie de brassage et prises RJ45, caméras et enregistreur, contrôle d’accès, détection incendie, avec les liaisons entre eux.'],
  cheminements: ['Plan des chemins de câbles', 'cheminements', 'Tracer sur le plan de départ les chemins de câbles et les principales liaisons entre les tableaux et les zones desservies.'],

const PROMPT = { affaireId: '', id: '', choix: null, enCours: false };
const promptsAffaire = a => (Array.isArray(a.prompts) ? a.prompts : []);
const lienClaude = t => 'claude://claude.ai/new?q=' + encodeURIComponent(t);
const slugCourt = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);

function cartePlanAutocad(a) {
  const ps = promptsAffaire(a);
  return `<section class="carte"><header class="carte-tete"><h2>Plan AutoCAD</h2>${ps.length ? `<span class="compteur">${ps.length}</span>` : ''}</header>

function ouvrirPromptPlan(a) {

/* Ce que la fiche affaire apporte au prompt. Aucun prix, aucun montant. */
function donneesPrompt(a) {
  const c = S.clients[a.clientId] || {}, D = a.dates || {}, e = etapeAffichee(a);
  const materiel = (a.lignes || []).filter(l => { const x = S.catalogue[l.code]; return Number(l.qte) > 0 && !(x && /^Main d/.test(x.categorie)); })
    .map(l => `- ${String(l.qte).replace('.', ',')} ${l.unite || 'u'} · ${l.designation}${l.code ? ' (' + l.code + ')' : ''}`);
  const journal = Object.values(S.activites).filter(h => h.affaireId === a.id && !['systeme', 'auto'].includes(h.type))
    .sort((x, y) => y.date.localeCompare(x.date)).slice(0, 8).map(h => `- ${fdate(h.date)} : ${h.texte}`);
  const quand = [D.visite && 'visite le ' + fdateLong(D.visite), D.debutPrevu && !D.debut && 'début prévu le ' + fdateLong(D.debutPrevu), D.debut && 'chantier commencé le ' + fdateLong(D.debut), D.finPrevue && !D.fin && 'fin prévue le ' + fdateLong(D.finPrevue), D.fin && 'chantier terminé le ' + fdateLong(D.fin)].filter(Boolean).join(', ');

  return { c, materiel, journal, quand, etape };

function garderTextePrompt() {
  const a = S.affaires[PROMPT.affaireId], ta = $('#prompt-texte'); if (!a || !ta) return;
  const p = promptsAffaire(a).find(x => x.id === PROMPT.id); if (!p || p.texte === ta.value) return;

async function preparerPrompt(a, choix) {
  PROMPT.affaireId = a.id; PROMPT.choix = choix;
  const p = { id: uid('pr'), date: nowISO(), auteur: PROFIL, type: choix.type, zone: choix.zone, fichier: choix.fichier, consignes: choix.consignes, ia: !!ia, texte: '' };
  const MARQUE = '\u0000', [avant, apres] = promptAutocad(a, choix, MARQUE).split(MARQUE);
  if (!ia) { p.texte = avant + resumeSansIA(a) + apres; afficherPrompt(a, p, p.texte, false); }
  else {
    PROMPT.enCours = true;
    afficherPrompt(a, p, avant + '…' + apres, true);
    let dernier = '';
    try {
      const res = await ia(consigneResume(a, choix), { modelTier: 'default', cache: false, onText: ({ text }) => {
        dernier = text; const ta = $('#prompt-texte'); if (ta && PROMPT.id === p.id) ta.value = avant + text + apres;
      } });
      const resume = (typeof res === 'string' && res.trim() ? res : dernier).trim();
      p.texte = avant + (resume || resumeSansIA(a)) + apres;
    } catch (e) {
      if (e && e.code === 'not_granted') ia = null;
      p.ia = false; p.texte = avant + resumeSansIA(a) + apres;
      toast(e && e.code === 'rate_limited' ? 'Trop de demandes : le prompt est rempli sans résumé de l’IA.' : 'L’IA n’a pas pu répondre : le prompt est rempli à partir de la fiche.');
    }
    PROMPT.enCours = false;
    const ta = $('#prompt-texte');
    if (ta && PROMPT.id === p.id) { ta.value = p.texte; ta.removeAttribute('readonly'); majLienPrompt(); }
  }
  enregistrerPrompt(a, p);
  log(a.clientId, a.id, 'systeme', `Prompt AutoCAD préparé : ${(TYPES_PLAN[p.type] || TYPES_PLAN.autre)[0]}${p.zone ? ', ' + p.zone : ''}.`);
  if ($('#fenetre').hidden) rendre(true); else renduEnAttente = true; // la carte et le journal se mettent à jour à la fermeture
}

async function telechargerPDF(kind, id, btn) {
  const obj = kind === 'devis' ? S.affaires[id] : kind === 'bon' ? S.bons[id] : S.factures[id];
  if (!obj) return;
  if (!dl && window.claude) { toast('Le téléchargement n’est pas disponible ici.'); return; }
  const lib = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Préparation…'; }
  try {
    const jsPDF = await chargerPdf();
    const doc = construirePDF(jsPDF, kind, obj), titre = infosDoc(kind, obj).titre;
    const nom = `${titre} ${obj.numero} - ${nomClient(obj.clientId)}.pdf`.replace(/[\\/:*?"<>|]/g, '');
    await enregistrerPDF(doc, nom);
    log(obj.clientId, kind === 'devis' ? obj.id : obj.affaireId, 'systeme', `PDF téléchargé : ${titre.toLowerCase()} ${obj.numero}.`);
    toast('PDF enregistré.');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') { /* refusé par l'utilisateur */ }
    else if (code === 'rate_limited') toast('Une fenêtre de téléchargement est déjà ouverte.');
    else if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed', 'extension_not_enabled'].includes(code)) { dl = null; toast('Le téléchargement n’est pas disponible ici.'); }
    else toast('Le PDF n’a pas pu être créé. Vérifiez la connexion puis réessayez.');
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = lib; } }
}

  const rang = v => { const i = ordre.indexOf(v); return i < 0 ? 99 : i; };
  return NAV.slice().sort((x, y) => rang(x[0]) - rang(y[0]));
}

    <p>${exemple ? 'Exemple : voilà ce qu’une photo de la feuille remplit.' : 'Voici les jours lus sur la photo.'} Vérifiez chaque nombre, choisissez le chantier, puis validez. Une case vide ne change rien.</p>

async function lirePhotoPointage(input, exemple) {

/* ---------- Saisie par photo : la photo d'une facture ou d'un bon de fournisseur remplit le formulaire d'achat ---------- */
const INVITE_PHOTO = `Tu lis la photo d'un document reçu d'un fournisseur par une entreprise d'électricité marocaine (facture, bon de commande, devis ou bon de livraison).
Réponds uniquement par un objet JSON, sans texte autour, avec exactement ces clés :
{"type": "facture" | "commande" | "livraison" | "autre", "fournisseur": "nom du fournisseur qui a émis le document", "objet": "résumé en moins de 8 mots de ce qui est acheté", "numero": "numéro du document", "date": "AAAA-MM-JJ", "ht": nombre (total hors taxes en dirhams), "tva": nombre (taux de TVA en %), "lisible": true | false}

function reduireImage(fichier, maxi) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxi / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error('image')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('image')); };
    img.src = url;
  });
}
